# Production override: adds Caddy (TLS termination + reverse proxy) in front of the two
# app containers. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required extra environment (see DEPLOYMENT.md "Production on a VPS"):
#   SITE_ADDRESS           e.g. hub.example.com — the one public domain
#   PUBLIC_API_BASE_URL    https://<SITE_ADDRESS> (same origin as the site, so no CORS)
#   CORS_ALLOWED_ORIGINS   https://<SITE_ADDRESS>
#
# Note: the base file publishes 5058/3000 on the host's loopback only (127.0.0.1), so they
# are not reachable from outside. Do not rely on ufw for this: Docker's own iptables rules
# bypass it, which is why the binding is restricted in the compose file itself.
services:
  backend:
    environment:
      # Trust Caddy's X-Forwarded-For so per-IP rate limits see real client addresses instead of
      # one shared proxy address. Safe only because the backend port is loopback-bound (see
      # docker-compose.yml) — never enable this on an API reachable without the proxy.
      ForwardedHeaders__Enabled: "true"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state — losing this only means re-issuing certs,
      # but keeping it avoids Let's Encrypt rate limits on repeated rebuilds.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy-data:
  caddy-config:
