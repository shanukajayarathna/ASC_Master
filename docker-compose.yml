# Two services only — MongoDB is Atlas (a managed cloud cluster the app already points at
# in every environment, dev included), not a container this compose file owns. See
# DEPLOYMENT.md for the full list of required environment variables.
services:
  backend:
    image: ${BACKEND_IMAGE:-asc-master-backend:local}
    build:
      context: ./backend
      dockerfile: Asc.Api/Dockerfile
    ports:
      # Loopback only: Docker publishes ports through its own iptables rules, which bypass
      # ufw/firewalld — a bare "5058:8080" would expose the API (no TLS, no Caddy headers)
      # to the internet on a VPS. Caddy reaches the container over the compose network.
      - "127.0.0.1:5058:8080"
    environment:
      ConnectionStrings__Mongo: ${MONGO_CONNECTION_STRING}
      MongoDatabaseName: ${MONGO_DATABASE_NAME:-asc_tea}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-asc-intelligence-hub}
      Jwt__Audience: ${JWT_AUDIENCE:-asc-intelligence-hub}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Groq__ApiKey: ${GROQ_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      # Local (Ollama) provider — opt-in via LOCAL_MODEL (see LocalChatProvider). Inside a
      # container "localhost" is the container itself, so the base URL must point at the
      # host's Ollama via host.docker.internal.
      Local__Model: ${LOCAL_MODEL:-}
      Local__BaseUrl: ${LOCAL_BASE_URL:-}
      # OKLO SmartAuction API — live sale data (see docs/31_OKLO_Live_Data.md). Empty = the
      # integration stays unconfigured; OKLO_AUTO_SYNC=true turns the background refresh on.
      Oklo__TokenUrl: ${OKLO_TOKEN_URL:-}
      Oklo__BaseUrl: ${OKLO_BASE_URL:-https://smartauctionreports.okloapps.com}
      Oklo__Scope: ${OKLO_SCOPE:-}
      Oklo__ClientId: ${OKLO_CLIENT_ID:-}
      Oklo__ClientSecret: ${OKLO_CLIENT_SECRET:-}
      Oklo__Username: ${OKLO_USERNAME:-}
      Oklo__Password: ${OKLO_PASSWORD:-}
      Oklo__AutoSync: ${OKLO_AUTO_SYNC:-false}
      # Stores every OKLO sale once in MongoDB (snapshots). Run it on ONE instance if you scale out.
      Oklo__SnapshotBackfill: ${OKLO_SNAPSHOT_BACKFILL:-true}
    volumes:
      # Sale-import Excel files, uploaded knowledge-base documents, and lot media all live
      # here (see Dockerfile's comment on the ContentRootPath/../../data convention) — a
      # named volume so they survive `docker compose down`/rebuilds.
      - asc-data:/data
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-asc-master-frontend:local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:5058}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  asc-data:
